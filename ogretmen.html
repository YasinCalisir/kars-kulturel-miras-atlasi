
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kars Atlası - Öğretmen Paneli</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 900px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 12px #ccc;
}
h1 {
    text-align: center;
    color: #174873;
}
h2 {
    color: #174873;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
th, td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: left;
}
th {
    background: #174873;
    color: white;
}
tr:nth-child(even) {
    background: #f2f6fa;
}
.score {
    font-weight: bold;
    color: #167333;
}
.warning {
    color: #777;
    text-align: center;
}
</style>
</head>

<body>
<div class="container">

<h1>🏫 Kars Atlası Öğretmen Paneli</h1>
<h2>🏆 Öğrenci Başarı Sıralaması</h2>

<p id="studentCount"></p>

<table>
<thead>
<tr>
<th>Sıra</th>
<th>Öğrenci</th>
<th>Sınıf</th>
<th>Okul</th>
<th>Puan</th>
</tr>
</thead>
<tbody id="studentList"></tbody>
</table>

<p class="warning">Kars Kültürel Miras Atlası</p>

</div>

<script>
let students = JSON.parse(
    localStorage.getItem("karsStudents") || "[]"
);

students.sort((a, b) =>
    (Number(b.score) || 0) - (Number(a.score) || 0)
);

let list = document.getElementById("studentList");

document.getElementById("studentCount").innerText =
    "Toplam öğrenci sayısı: " + students.length;

students.slice(0, 10).forEach((student, index) => {
    let row = document.createElement("tr");

    let values = [
        index + 1,
        student.name || "",
        student.studentClass || "",
        student.school || "",
        (Number(student.score) || 0) + " puan"
    ];

    values.forEach((value, i) => {
        let cell = document.createElement("td");
        cell.textContent = value;

        if (i === 4) {
            cell.className = "score";
        }

        row.appendChild(cell);
    });

    list.appendChild(row);
});

if (students.length === 0) {
    list.innerHTML =
        '<tr><td colspan="5">Henüz öğrenci kaydı bulunamadı.</td></tr>';
}
</script>

</body>
</html>
