
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kars Atlası - Öğrenci Sıralaması</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 20px;
    color: #263445;
}
.container {
    max-width: 950px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 12px #ccc;
}
h1, h2 {
    color: #174873;
    text-align: center;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
th, td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: left;
}
th {
    background: #174873;
    color: white;
}
tr:nth-child(even) {
    background: #f2f6fa;
}
.score {
    color: #167333;
    font-weight: bold;
}
.rank {
    font-weight: bold;
    color: #174873;
}
.info {
    text-align: center;
    color: #667788;
}
.home {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #147c8b;
    font-weight: bold;
    text-decoration: none;
}
@media(max-width:600px) {
    .container { padding: 12px; }
    th, td { padding: 7px; font-size: 12px; }
}
</style>
</head>

<body>

<div class="container">

<h1>🏆 Kars Atlası</h1>
<h2>Öğrenci Başarı Sıralaması</h2>

<p class="info" id="studentCount"></p>

<table>
<thead>
<tr>
<th>Sıra</th>
<th>Öğrenci</th>
<th>Sınıf</th>
<th>Okul</th>
<th>Puan</th>
</tr>
</thead>

<tbody id="studentList"></tbody>
</table>

<a href="index.html" class="home">← Ana Sayfaya Dön</a>

</div>

<script>

function showRanking() {

    let students = JSON.parse(
        localStorage.getItem("karsStudents") || "[]"
    );

    students.sort((a, b) =>
        (Number(b.score) || 0) - (Number(a.score) || 0)
    );

    let list = document.getElementById("studentList");
    list.innerHTML = "";

    document.getElementById("studentCount").textContent =
        "Toplam öğrenci sayısı: " + students.length;

    students.forEach((student, index) => {

        let row = document.createElement("tr");

        let values = [
            index + 1,
            student.name || "",
            student.studentClass || "",
            student.school || "",
            (Number(student.score) || 0) + " puan"
        ];

        values.forEach((value, i) => {

            let cell = document.createElement("td");
            cell.textContent = value;

            if (i === 0) cell.className = "rank";
            if (i === 4) cell.className = "score";

            row.appendChild(cell);
        });

        list.appendChild(row);
    });

    if (students.length === 0) {
        list.innerHTML =
        '<tr><td colspan="5">Henüz öğrenci kaydı bulunmuyor.</td></tr>';
    }
}

showRanking();

</script>

</body>
</html>
